name: iOS build

# The upstream CI (build.yml -> scons-build.yml) has no iOS job. This one builds the iOS
# GDExtension and godot-cpp xcframeworks with build.py (build_ios.sh), checks that the
# extension's entry point and the AdMob impression binding are in the library, and uploads
# bin/ios/ as an artifact.

on:
  push:
    branches: ['*']
    tags-ignore: ['*']
  workflow_dispatch:

jobs:
  ios:
    name: ios-${{ matrix.config }}
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: python -m pip install scons

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build
        run: python build.py ios ${{ matrix.config }}

      - name: Verify build artifact
        shell: bash
        run: |
          set -euo pipefail
          CFG=template_${{ matrix.config }}
          for FW in bin/ios/libGodotGameAnalytics.ios.$CFG.xcframework bin/ios/libgodot-cpp.ios.$CFG.xcframework; do
            test -f "$FW/Info.plist"
            find "$FW" -name '*.a' -exec lipo -info {} \;
          done
          LIB=$(find bin/ios/libGodotGameAnalytics.ios.$CFG.xcframework -name '*.a' | head -1)
          # whole outputs to files first: grep -q closing a pipe early fails the step under pipefail
          nm -gU "$LIB" > symbols.txt
          nm -u "$LIB" > undefined.txt
          grep -q gameanalytics_init symbols.txt
          grep addImpressionAdMobEvent symbols.txt
          # the iOS SDK call: an objc_msgSend$<selector> stub symbol (clang's selector stubs) or a selector
          # reference, either way the selector's name is in the archive
          grep 'addImpressionAdMobEventWithAdNetworkVersion:impressionData:' undefined.txt || LC_ALL=C grep -a -c 'addImpressionAdMobEventWithAdNetworkVersion:impressionData:' "$LIB"
          shasum -a 256 $(find bin/ios -name '*.a')
          echo "artifact ok: $LIB"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: godotgameanalytics-ios-${{ matrix.config }}
          path: bin/ios/
          retention-days: 30
